---
name: Agent maintenance

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-agent-knowledge:
    name: Validate agent and skill synchronization
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository and PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate maintenance synchronization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python3 scripts/check_agent_maintenance.py --base "$BASE_SHA"
          else
            python3 scripts/check_agent_maintenance.py
          fi
