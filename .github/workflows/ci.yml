---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  openbsd-80-amd64:
    name: OpenBSD 8.0 (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test on OpenBSD 8.0
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3  # v1.4.9
        with:
          release: "8.0"
          sync-time: true
          copyback: false
          prepare: &vm-prepare |
            set -eu

            echo "== VM environment =="
            uname -a
            uname -m
            sysctl kern.version

            echo "== Installing the native Rust toolchain =="
            # OpenBSD ships rustc and cargo in `lang/rust`; clippy and rustfmt
            # are separate packages. There is no rustup on OpenBSD.
            pkg_add rust rust-clippy rust-rustfmt

            echo "== Toolchain versions =="
            rustc --version
            cargo --version
            cargo clippy --version
            cargo fmt --version

            echo "== Creating unprivileged build user =="
            groupadd builder
            useradd -m -g builder -s /bin/ksh builder
            chown -R builder:builder "$GITHUB_WORKSPACE"
            printf 'permit nopass root as builder\n' > /etc/doas.conf

          run: &vm-run |
            set -eu
            cd "$GITHUB_WORKSPACE"

            echo "== Unprivileged build and tests =="
            cat > /tmp/openbsd-build.ksh <<'EOF'
            set -eu
            export CARGO_TERM_COLOR=never

            cargo fmt --all -- --check
            # Clippy only type-checks, so it can cover every feature, including
            # `openbsd-8-0`.
            cargo clippy --all-targets --all-features -- -D warnings
            # Keep the 7.9-compatible default feature set compiling; its kernel
            # tests cannot run on 8.0 because exec and error were removed.
            cargo check --all-targets
            # OpenBSD 8.0 removed the exec and error promises, so the kernel
            # tests run with the openbsd-8-0 feature set. This also exercises
            # getexecpath(3).
            cargo test --all-features -- --nocapture
            cargo test --all-features

            # Feature combinations, including no_std without allocation and the
            # OpenBSD 8.0 surface.
            cargo build --no-default-features
            cargo build --no-default-features --features alloc
            cargo build --features openbsd-8-0
            cargo check --all-features

            cargo doc --no-deps --all-features

            # Package metadata and contents.
            cargo package --allow-dirty
            EOF
            chown builder /tmp/openbsd-build.ksh
            if ! doas -u builder /bin/ksh /tmp/openbsd-build.ksh; then
                echo "== dmesg tail ==" >&2
                dmesg | tail -30 >&2
                exit 1
            fi

            echo "== Privileged tests as root =="
            if ! cargo test --all-features -- --nocapture > /tmp/openbsd-root.log 2>&1; then
                cat /tmp/openbsd-root.log
                echo "ERROR: privileged test run failed" >&2
                exit 1
            fi
            cat /tmp/openbsd-root.log
            if grep -q 'requires root privileges' /tmp/openbsd-root.log; then
                echo "ERROR: privileged tests were unexpectedly skipped" >&2
                exit 1
            fi
            echo "Privileged tests executed and passed."

  openbsd-80-arm64:
    name: OpenBSD 8.0 (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test on OpenBSD 8.0
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3  # v1.4.9
        with:
          release: "8.0"
          arch: aarch64
          sync-time: true
          copyback: false
          prepare: *vm-prepare
          run: *vm-run
